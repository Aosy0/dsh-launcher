<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>DSH Launcher — v2 A compact list</title>
<style>
  :root{
    --deep:#0f0f10; --page:#141415; --card:#19191b; --raised:#232325;
    --text:#ededed; --sec:#a1a1a6; --muted:#85858b;
    --line:rgba(237,237,237,.08); --line2:rgba(237,237,237,.14);
    --pos:#4cc38a; --attn:#d9a441; --neg:#e5484d;
    --mono:"Cascadia Mono","Consolas",monospace;
    --sans:"Segoe UI Variable Text","Segoe UI","Yu Gothic UI","Meiryo",sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:480px;height:348px;overflow:hidden}
  body{background:var(--page);color:var(--text);font-family:var(--sans);font-size:13px;-webkit-font-smoothing:antialiased}
  .win{width:100%;height:100%;display:flex;flex-direction:column;border:1px solid var(--line);border-radius:10px;overflow:hidden}
  .titlebar{height:30px;flex:none;display:flex;align-items:center;gap:8px;padding:0 10px;background:var(--deep);border-bottom:1px solid var(--line);color:var(--sec);font-size:12px}
  .glyph{width:16px;height:16px;border:1px solid var(--line2);border-radius:4px;display:grid;place-items:center;font-family:var(--mono);font-size:8px}
  .titlebar .sp{margin-left:auto;display:flex;gap:2px;color:var(--muted)}
  .ico{width:22px;height:22px;display:grid;place-items:center;border-radius:5px}
  .body{flex:1;display:flex;flex-direction:column;padding:10px 10px 8px;min-height:0}
  .label{font-size:10.5px;color:var(--muted);padding:2px 2px 6px;letter-spacing:.01em}
  .rows{display:flex;flex-direction:column;gap:2px}
  .row{display:flex;align-items:center;gap:8px;height:38px;padding:0 8px;border-radius:7px;border:1px solid transparent;color:var(--sec)}
  .row.sel{background:var(--raised);border-color:var(--line);color:var(--text);box-shadow:inset 0 1px 0 rgba(255,255,255,.06)}
  .lamp{width:7px;height:7px;border-radius:50%;flex:none;background:var(--muted)}
  .lamp.on{background:var(--pos)} .lamp.attn{background:var(--attn)} .lamp.off{background:#5a5a60}
  .name{font-size:12.5px;white-space:nowrap}
  .state{margin-left:auto;font-size:11px;color:var(--muted);white-space:nowrap}
  .acts{display:flex;gap:4px;margin-left:8px}
  .mini{height:24px;padding:0 9px;border-radius:6px;border:1px solid var(--line2);background:var(--card);color:var(--text);font-size:11.5px;font-family:inherit;display:inline-flex;align-items:center;gap:5px}
  .mini.primary{background:var(--text);border-color:var(--text);color:#141415;font-weight:500}
  .detail{margin:4px 0 6px 23px;background:var(--card);border:1px solid var(--line);border-radius:7px;padding:9px 10px;display:flex;flex-direction:column;gap:7px}
  .url{display:flex;align-items:center;gap:8px;font-family:var(--mono);font-size:11.5px;color:var(--sec)}
  .url .copy{margin-left:auto;color:var(--muted);display:inline-flex;align-items:center;gap:4px;font-family:var(--sans);font-size:10.5px}
  .facts{font-family:var(--mono);font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
  .cmdrow{display:flex;align-items:center;gap:8px;border-top:1px solid var(--line);padding-top:7px}
  .cmdrow .cl{font-size:10.5px;color:var(--muted);white-space:nowrap}
  .cmdrow .cmd{font-family:var(--mono);font-size:11px;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .cmdrow .copy{margin-left:auto;color:var(--muted);display:inline-flex;flex:none}
  .bottom{margin-top:auto;display:flex;align-items:center;padding:6px 2px 2px;color:var(--muted);font-size:11px}
  .bottom .l{display:flex;align-items:center;gap:6px}
  .bottom .r{margin-left:auto;display:flex;gap:12px}
  .statusbar{height:24px;flex:none;display:flex;align-items:center;padding:0 10px;border-top:1px solid var(--line);background:var(--deep);color:var(--muted);font-size:10.5px;font-family:var(--mono)}
  .statusbar .r{margin-left:auto}
  svg{width:14px;height:14px;stroke:currentColor;stroke-width:1.5;fill:none;stroke-linecap:round;stroke-linejoin:round}
  .svg12{width:12px;height:12px}
</style>
</head>
<body>
<div class="win">
  <div class="titlebar">
    <div class="glyph">&gt;_</div>
    <span>DSH Launcher</span>
    <div class="sp">
      <span class="ico"><svg viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 3v5h-5"/></svg></span>
      <span class="ico"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1-1.5 1.7 1.7 0 0 0-1.9.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1 1.7 1.7 0 0 0-.3-1.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.9.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.9-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.9V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></span>
    </div>
  </div>

  <div class="body">
    <div class="label">マシン</div>
    <div class="rows">
      <div class="row sel">
        <span class="lamp on"></span><span class="name">このPC</span>
        <span class="state">稼働中 3:12:04</span>
        <span class="acts"><button class="mini primary">再起動</button><button class="mini">停止</button></span>
      </div>
      <div class="detail">
        <div class="url">https://nzxt.tail34c6a3.ts.net/<span class="copy"><svg class="svg12" viewBox="0 0 24 24"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>コピー</span></div>
        <div class="facts">PID 55832 · ポート 3080 · メモリ 412 MB</div>
        <div class="cmdrow"><span class="cl">実行されるコマンド</span><span class="cmd">dsh web --profile web --port 3080</span><span class="copy"><svg class="svg12" viewBox="0 0 24 24"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg></span></div>
      </div>
      <div class="row">
        <span class="lamp attn"></span><span class="name">minipc-server</span>
        <span class="state">要セットアップ</span>
        <span class="acts"><button class="mini">セットアップ</button></span>
      </div>
      <div class="row">
        <span class="lamp attn"></span><span class="name">cpswhitegtx1080ti</span>
        <span class="state">要セットアップ</span>
        <span class="acts"><button class="mini">セットアップ</button></span>
      </div>
    </div>

    <div class="bottom">
      <span class="l"><svg class="svg12" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>マシンを追加</span>
      <span class="r"><span>ブラウザで開く</span><span>ログ</span></span>
    </div>
  </div>
  <div class="statusbar"><span>web · ポート 3080</span><span class="r">v0.1</span></div>
</div>
</body>
</html>
