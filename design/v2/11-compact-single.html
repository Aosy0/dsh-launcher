<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>DSH Launcher — v2 B single compact</title>
<style>
  :root{
    --deep:#0f0f10; --page:#141415; --card:#19191b; --raised:#232325;
    --text:#ededed; --sec:#a1a1a6; --muted:#85858b;
    --line:rgba(237,237,237,.08); --line2:rgba(237,237,237,.14);
    --pos:#4cc38a; --attn:#d9a441;
    --mono:"Cascadia Mono","Consolas",monospace;
    --sans:"Segoe UI Variable Text","Segoe UI","Yu Gothic UI","Meiryo",sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:420px;height:344px;overflow:hidden}
  body{background:var(--page);color:var(--text);font-family:var(--sans);font-size:13px;-webkit-font-smoothing:antialiased}
  .win{width:100%;height:100%;display:flex;flex-direction:column;border:1px solid var(--line);border-radius:10px;overflow:hidden}
  .titlebar{height:30px;flex:none;display:flex;align-items:center;gap:8px;padding:0 10px;background:var(--deep);border-bottom:1px solid var(--line);color:var(--sec);font-size:12px}
  .glyph{width:16px;height:16px;border:1px solid var(--line2);border-radius:4px;display:grid;place-items:center;font-family:var(--mono);font-size:8px}
  .titlebar .sp{margin-left:auto;color:var(--muted);display:flex;gap:2px}
  .ico{width:22px;height:22px;display:grid;place-items:center;border-radius:5px}
  .body{flex:1;display:flex;flex-direction:column;padding:10px;gap:8px}
  .tabs{display:flex;gap:2px;background:var(--deep);border:1px solid var(--line);border-radius:7px;padding:2px}
  .tab{flex:1;height:26px;display:flex;align-items:center;justify-content:center;gap:5px;border-radius:5px;color:var(--muted);font-size:11.5px;white-space:nowrap}
  .tab.sel{background:var(--raised);color:var(--text);box-shadow:inset 0 1px 0 rgba(255,255,255,.06)}
  .lamp{width:7px;height:7px;border-radius:50%;flex:none;background:var(--muted)}
  .lamp.on{background:var(--pos)} .lamp.attn{background:var(--attn)}
  .status{display:flex;align-items:baseline;gap:8px;padding:0 2px}
  .state{font-size:16px;font-weight:500;letter-spacing:-.01em}
  .meta{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
  .facts{font-family:var(--mono);font-size:11px;color:var(--muted);padding:0 2px;font-variant-numeric:tabular-nums}
  .url{display:flex;align-items:center;gap:8px;font-family:var(--mono);font-size:11.5px;color:var(--sec);padding:0 2px;white-space:nowrap}
  .url .copy{margin-left:auto;color:var(--muted);display:inline-flex;align-items:center;gap:4px;font-family:var(--sans);font-size:10.5px}
  .acts{display:flex;gap:6px;margin-top:2px}
  .btn{height:30px;flex:1;border-radius:7px;border:1px solid var(--line2);background:var(--card);color:var(--text);font-size:12px;font-family:inherit;display:inline-flex;align-items:center;justify-content:center;gap:6px}
  .btn.primary{background:var(--text);border-color:var(--text);color:#141415;font-weight:500}
  .logs{border-top:1px solid var(--line);padding-top:8px;display:flex;flex-direction:column;gap:1px;font-family:var(--mono);font-size:10.5px;line-height:1.7;color:#8b8b91;white-space:nowrap;overflow:hidden}
  .receipt{margin-top:auto;border-top:1px solid var(--line);padding-top:8px;display:flex;flex-direction:column;gap:4px}
  .receipt .cl{font-size:10.5px;color:var(--muted)}
  .receipt .cmd{display:flex;align-items:center;gap:6px;font-family:var(--mono);font-size:11px;color:var(--text)}
  .receipt .cmd .copy{margin-left:auto;color:var(--muted);display:inline-flex}
  .statusbar{height:22px;flex:none;display:flex;align-items:center;padding:0 10px;border-top:1px solid var(--line);background:var(--deep);color:var(--muted);font-size:10.5px;font-family:var(--mono)}
  .statusbar .r{margin-left:auto}
  svg{width:14px;height:14px;stroke:currentColor;stroke-width:1.5;fill:none;stroke-linecap:round;stroke-linejoin:round}
  .svg12{width:12px;height:12px}
</style>
</head>
<body>
<div class="win">
  <div class="titlebar">
    <div class="glyph">&gt;_</div><span>DSH Launcher</span>
    <div class="sp"><span class="ico"><svg viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 3v5h-5"/></svg></span></div>
  </div>
  <div class="body">
    <div class="tabs">
      <div class="tab sel"><span class="lamp on"></span>このPC</div>
      <div class="tab"><span class="lamp attn"></span>minipc</div>
      <div class="tab"><span class="lamp attn"></span>cpswhite</div>
    </div>

    <div class="status"><span class="lamp on"></span><span class="state">稼働中</span><span class="meta">3:12:04</span></div>
    <div class="facts">PID 55832 · ポート 3080 · メモリ 412 MB</div>
    <div class="url">https://nzxt.tail34c6a3.ts.net/<span class="copy"><svg class="svg12" viewBox="0 0 24 24"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>コピー</span></div>

    <div class="acts">
      <button class="btn primary">再起動</button>
      <button class="btn">停止</button>
      <button class="btn">開く</button>
    </div>

    <div class="logs"><div>00:31:02  dsh web listening on :3080</div><div>01:12:40  session 4db2c0a9 opened</div></div>
    <div class="receipt">
      <span class="cl">実行されるコマンド</span>
      <span class="cmd">dsh web --profile web --port 3080<span class="copy"><svg class="svg12" viewBox="0 0 24 24"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg></span></span>
    </div>
  </div>
  <div class="statusbar"><span>web · 3080</span><span class="r">v0.1</span></div>
</div>
</body>
</html>
