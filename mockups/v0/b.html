<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>DSH Launcher — B game launcher</title>
<style>
  :root{
    --bg:#141519; --layer:#1e2026; --layer2:#262931; --border:rgba(255,255,255,.09);
    --text:#f4f5f7; --sub:#a2a6b0; --dim:#6d7079;
    --accent:#4d6bfe; --accent-hi:#7c93ff; --ok:#3ddc84;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{width:1280px; height:800px; overflow:hidden;}
  body{
    color:var(--text); font-family:"Yu Gothic UI","Noto Sans JP","Meiryo","Segoe UI",sans-serif;
    background:
      radial-gradient(900px 520px at 18% 8%, rgba(77,107,254,.32), transparent 62%),
      radial-gradient(700px 520px at 92% 100%, rgba(61,220,132,.13), transparent 60%),
      linear-gradient(160deg,#16171c 0%, #101115 100%);
    -webkit-font-smoothing:antialiased;
  }
  .chrome{height:56px; display:flex; align-items:center; padding:0 30px; gap:18px;
    border-bottom:1px solid rgba(255,255,255,.06);}
  .mark{width:22px; height:22px; border-radius:7px; background:linear-gradient(135deg,var(--accent-hi),var(--accent));
    box-shadow:0 0 18px rgba(77,107,254,.7);}
  .chrome-title{font-size:20px; letter-spacing:.22em; color:var(--sub);}
  .chrome-btns{margin-left:auto; display:flex; gap:26px; color:var(--dim); font-size:22px;}
  .main{display:grid; grid-template-columns:1.15fr .85fr; gap:40px; padding:44px 52px 12px; height:604px;}
  .left{display:flex; flex-direction:column; align-items:center; justify-content:center;}
  .ring{
    width:300px; height:300px; border-radius:50%; position:relative;
    background:conic-gradient(var(--ok) 0deg 252deg, rgba(255,255,255,.07) 252deg 360deg);
    filter:drop-shadow(0 0 34px rgba(61,220,132,.35));
    display:grid; place-items:center;
  }
  .ring::after{content:""; position:absolute; inset:16px; border-radius:50%; background:#171920;}
  .ring-inner{position:relative; z-index:2; text-align:center; display:flex; flex-direction:column; gap:6px;}
  .big{font-size:44px; font-weight:700;}
  .pid{font-size:17px; color:var(--dim); letter-spacing:.06em;}
  .wordmark{margin-top:34px; font-size:34px; letter-spacing:.04em; color:#e9ebf2;}
  .wordmark b{font-weight:800; letter-spacing:.3em;}
  .chips{display:flex; gap:12px; margin-top:22px;}
  .chips span{font-size:16px; color:var(--sub); border:1px solid var(--border); background:rgba(255,255,255,.04);
    border-radius:999px; padding:8px 18px;}
  .right{display:flex; flex-direction:column; justify-content:center; gap:14px;}
  .right button{
    height:66px; border-radius:14px; border:1px solid var(--border); background:var(--layer);
    color:var(--text); font-size:21px; font-family:inherit; cursor:pointer; text-align:left; padding:0 26px;
  }
  .right button.primary{
    height:82px; border:0; font-size:26px; font-weight:700; text-align:center;
    background:linear-gradient(180deg,var(--accent-hi),var(--accent));
    box-shadow:0 12px 32px rgba(77,107,254,.38), inset 0 1px 0 rgba(255,255,255,.28);
  }
  .logs{height:140px; margin:0 52px 34px; border:1px solid rgba(255,255,255,.07); border-radius:14px;
    background:rgba(0,0,0,.35); padding:16px 22px; font-family:"Cascadia Mono",Consolas,monospace;
    font-size:15px; line-height:1.9; color:#9aa3b5;}
  .logs b{color:var(--ok); font-weight:600;}
  .logs span{color:#5f6573;}
</style>
</head>
<body>
  <div class="chrome">
    <div class="mark"></div>
    <div class="chrome-title">DSH LAUNCHER</div>
    <div class="chrome-btns"><span>—</span><span>✕</span></div>
  </div>
  <div class="main">
    <div class="left">
      <div class="ring">
        <div class="ring-inner">
          <span class="big">稼働中</span>
          <span class="pid">PID 55832 · 3h 12m</span>
        </div>
      </div>
      <div class="wordmark">DeepSeek <b>HARNESS</b></div>
      <div class="chips"><span>:3080</span><span>web</span><span>Tailscale</span></div>
    </div>
    <div class="right">
      <button class="primary">再起動</button>
      <button>起動</button>
      <button>停止</button>
      <button>ブラウザで開く</button>
      <button>ログを見る</button>
    </div>
  </div>
  <div class="logs">
    <div><span>00:31:02</span>  dsh web <b>listening</b> on http://127.0.0.1:3080</div>
    <div><span>00:31:03</span>  profile web · 6 plugins · patchReload live</div>
    <div><span>00:31:05</span>  tailscale url ready: nzxt.tail34c6a3.ts.net</div>
  </div>
</body>
</html>
